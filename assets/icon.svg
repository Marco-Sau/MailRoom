<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#20243a"/><stop offset="0.55" stop-color="#11141f"/><stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.12" r="0.75"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1.0" r="0.7"><stop offset="0" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a4ff"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <!-- tile -->
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowA)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowB)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- glyph: the in-app logo, scaled -->
  <g fill="none" stroke="url(#stroke)" stroke-width="44" opacity=".45" filter="url(#soft)" clip-path="url(#sq)">
    <rect x="232" y="312" width="560" height="400" rx="112"/>
  </g>
  <g fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-linejoin="round" stroke-width="44">
    <rect x="232" y="312" width="560" height="400" rx="112"/>
    <path d="M282 382 512 552 742 382"/>
  </g>
  <!-- notification dot -->
  <circle cx="792" cy="320" r="92" fill="#22d3ee" opacity=".35" filter="url(#soft)"/>
  <circle cx="792" cy="320" r="72" fill="#11141f"/>
  <circle cx="792" cy="320" r="56" fill="#22d3ee"/>
  <circle cx="776" cy="302" r="16" fill="#ffffff" opacity=".45"/>
</svg>
