[project]
name = "mailroom"
version = "0.1.0"
description = "Local macOS control panel for AI-assisted email triage: Gmail -> classify/prioritize -> Sheets recap -> Calendar slots -> reviewable drafts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "keyring>=25.0",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "python-dateutil>=2.9",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]
# Native window. pywebview pulls pyobjc and uses WKWebView on macOS.
desktop = ["pywebview>=5.1"]

[project.scripts]
mailroom = "mailroom.cli:main"
mailroom-desktop = "mailroom.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
